# HTTP to HTTPS 리다이렉트
server {
    listen 80;
    server_name 158.247.239.66 daewoolife.co.kr www.daewoolife.co.kr;
    
    # Let's Encrypt 인증서 갱신을 위한 경로
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 서버
server {
    listen 443 ssl http2;
    server_name 158.247.239.66 daewoolife.co.kr www.daewoolife.co.kr;
    
    # SSL 인증서 설정
    ssl_certificate /etc/letsencrypt/live/daewoolife.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daewoolife.co.kr/privkey.pem;
    
    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 루트 디렉토리 설정
    root /opt/applications/daewoo-website/static;
    index index.html;
    
    # 로그 설정
    access_log /var/log/nginx/daewoo-website_access.log;
    error_log /var/log/nginx/daewoo-website_error.log;

    # .html 요청은 확장자 없는 경로로 리다이렉트 (클라이언트 요청에만 적용)
    if ($request_uri ~ ^/(.+)\.html$) {
        return 301 /$1$is_args$args;
    }
    
    # 정적 파일 직접 서빙 (Nginx에서 직접 처리)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|json|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Spring Boot 애플리케이션으로 프록시 (정적 파일이 아닌 경우)
    location / {
        try_files $uri $uri/ $uri.html @springboot;
    }
    
    location @springboot {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 버퍼 설정
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

